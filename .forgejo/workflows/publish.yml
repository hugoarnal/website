name: Upload to preview

on:
  push:
    branches:
      - preview
  workflow_dispatch:

env:
  ZOLA_VERSION: v0.23.6

jobs:
  upload-website:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

        # Taken from https://codeberg.org/casuarina/casuarina.org/src/branch/main/.forgejo/workflows/publish.yaml
      - name: Build site with Zola
        run: |
          URL="https://github.com/getzola/zola/releases/download/${{ env.ZOLA_VERSION }}/zola-${{ env.ZOLA_VERSION }}-x86_64-unknown-linux-gnu.tar.gz"

          wget -O /tmp/zola.tar.gz $URL
          tar zxf /tmp/zola.tar.gz zola
          ./zola build --base-url="${{ vars.SITE_URL }}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/git-pages@8f8f20eeda940df9f7f31c0f3721050999705d67
        with:
          site: ${{ vars.SITE_URL }}
          server: codeberg.page
          token: ${{ forgejo.token }}
          source: public/
