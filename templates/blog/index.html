{% extends "base.html" %}

{% block content %}
<main class="content">
    <div style="display: flex; align-items: center; gap: 1em">
        <h1 class="title">
            {{ section.title }}
        </h1>
        {{ <rss_button /> }}
    </div>

    {{ <notice /> }}

    {{ section.content | safe }}

    <ul>
        {% for page in section.pages %}
            {% if page.extra.draft %}
                {% continue %}
            {% endif %}
            <li>
                <a href="{{ page.permalink | safe }}">{{ page.title }}</a> ({{ page.date }})
            </li>
        {% endfor %}
    </ul>
</main>
{% endblock content %}
